name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi

      - name: Build release binary
        run: swift build -c release

      - name: Assemble app bundle
        run: |
          APP="Launchpad.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/Launchpad "$APP/Contents/MacOS/Launchpad"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Launchpad</string>
            <key>CFBundleIdentifier</key><string>com.qdt.launchpad</string>
            <key>CFBundleName</key><string>Launchpad</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Launchpad-macOS.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Launchpad-macOS
          path: Launchpad-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach build to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Launchpad-macOS.zip
