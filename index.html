<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c"><title>Launchpad · 应用启动台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="launchpad" aria-label="应用启动台">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✣</span><span>Launchpad</span></div>
      <div class="top-actions"><span class="hint"><kbd>⌘</kbd><kbd>K</kbd> 搜索</span><button class="icon-btn" id="themeButton" aria-label="切换外观">◐</button></div>
    </header>
    <section class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="搜索应用…" autocomplete="off" aria-label="搜索应用"><kbd class="esc">ESC</kbd></section>
    <nav class="filters" id="filters" aria-label="应用分类"></nav>
    <section class="apps" id="apps" aria-live="polite"></section>
    <footer><span id="count"></span><div class="page-dots" id="dots" aria-label="页面"></div><span class="footer-note">拖动图标可整理 · <kbd>←</kbd><kbd>→</kbd> 翻页</span></footer>
  </main>
  <script src="app.js"></script>
</body></html>
